ng').hidden=true;canvas.focus();}).catch(e=>{document.querySelector('#loading').hidden=true;const el=document.querySelector('#error');el.hidden=false;el.textContent='起動できませんでした。ページを再読み込みしてください。\n'+e;});</script></body></html>
