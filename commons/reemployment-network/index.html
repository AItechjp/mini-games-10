="M 0 0 L 10 5 L 0 10 z" fill="#6991aa"/></marker></defs><g id="scene"></g></svg><p id="empty" hidden>条件に一致する記録はありません。</p></div><div class="graph-foot">ドラッグで移動 / ＋−で拡大縮小 / 項目を選ぶと根拠を表示</div></section><aside id="detail" class="detail" aria-live="polite"><p class="eyebrow">DETAIL</p><h2>項目を選択</h2><p>図または検索結果から選ぶと、関係と出典を確認できます。</p></aside></div><footer>図の線は資料に記された関係を表します。再就職の掲載は、違法性やあっせんの認定を意味しません。</footer></section></main></body></html>
