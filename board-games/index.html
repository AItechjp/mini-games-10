<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101c38"><title>ボードゲーム | AITECH GAMES</title><meta name="description" content="五目並べ・将棋・囲碁・オセロ・チェス・モノポリー・人生ゲーム。CPUと1人、同じ端末で2人。3Dプレイヤーと囲むゲームテーブル。"><link rel="stylesheet" href="table.css?v=1"><link rel="stylesheet" href="mobile.css?v=1"></head>
<body><header class="top"><a href="../games-board.html">← ボードゲーム一覧</a><a class="brand" href="../games.html">AITECH <b>GAMES</b></a><button id="rules-open">遊び方</button></header>
<main><section class="table-header"><div><p class="eyebrow">2D / BOARD GAMES</p><h1 id="title">五目並べ</h1></div><div class="settings"><label>ゲーム<select id="game"><option value="gomoku">05 五目並べ</option><option value="shogi">将棋</option><option value="go">囲碁・9路盤</option><option value="othello">オセロ</option><option value="chess">チェス</option><option value="monopoly">モノポリー・短時間版</option><option value="life">人生ゲーム・短時間版</option></select></label><label>人数<select id="mode"><option value="solo">1人 · CPU対戦</option><option value="local">2人 · 同じ端末</option></select></label><button id="restart">はじめから</button></div></section>
<section class="arena" aria-label="3Dプレイヤーのいる対戦テーブル"><div id="scene"></div><div id="scene-fallback" hidden>3D表示を利用できません。この端末でも盤面でプレイできます。</div><div class="player-label p1"><span class="player-dot"></span><b id="name1">あなた</b><small id="score1">黒・先手</small></div><div class="player-label p2"><span class="player-dot"></span><b id="name2">CPU</b><small id="score2">白・後手</small></div><div class="arena-caption">BOARD TABLE <span>01</span></div><button id="motion" aria-pressed="false">動きを止める</button></section>
<section class="play-area"><div class="board-panel"><div class="turn-line"><span id="turn-badge">黒の番</span><span id="round">対局を始めましょう</span></div><div id="hand2" class="hand"></div><div id="board" aria-label="ゲーム盤"></div><div id="hand1" class="hand"></div><div id="choice" class="choice"></div></div><aside class="sidebar"><p class="eyebrow">YOUR NEXT MOVE</p><h2 id="instruction">石を置く</h2><p id="status" role="status" aria-live="polite">ゲームを準備しています。</p><div id="actions" class="action-list"></div><div id="assets"></div><details open class="quick-rules"><summary>このゲームのルール</summary><div id="rules-short"></div></details><div id="history" aria-label="直近の手"></div><button class="quiet" id="resign">投了する</button></aside></section>
<p class="footnote" id="edition"></p><p class="footnote"><a href="licenses.html">ライセンス</a> · <a href="../games-2d.html">2Dゲームへ</a></p></main>
<dialog id="rules-dialog"><div class="dialog-heading"><h2 id="rules-title">遊び方</h2><button id="rules-close" autofocus>閉じる</button></div><div id="rules-full"></div></dialog>
<dialog id="confirm-dialog"><h2 id="confirm-title">対局を最初からやり直しますか？</h2><p>現在の対局は終了します。</p><div class="dialog-actions"><button id="confirm-no">戻る</button><button id="confirm-yes" class="primary">やり直す</button></div></dialog>
<script src="../gomoku-engine.js"></script><script type="module" src="table.mjs?v=1"></script></body></html>
