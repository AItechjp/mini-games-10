<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="GAME 15 CHAIN ORBS。同色4個以上をつなげて消す20秒連鎖パズル。PC・スマホ対応。">
  <title>GAME 15 - CHAIN ORBS | 20秒ミニゲームズ</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="mode-switch.css">
  <link rel="stylesheet" href="puzzle15.css">
</head>
<body class="puzzle-page">
<header class="site-header"><div class="wrap header-inner"><a class="brand" href="index.html">20秒ミニゲームズ</a><nav><a href="#game">GAME 15</a><a href="solo.html">ゲーム一覧</a></nav></div></header>
<main class="wrap">
  <div class="mode-switch-bar" aria-label="サイトモード"><button class="mode-switch-btn" data-mode-href="solo.html">1人用</button><button class="mode-switch-btn" data-mode-href="online.html">オンライン対戦</button><button class="mode-switch-btn" data-mode-href="chat.html">チャット</button></div>
  <section class="hero puzzle-hero"><p class="eyebrow">GAME 15 / CHAIN ORBS</p><h1>つなげて、<br>連鎖を爆発させろ。</h1><p>2個1組のオーブを落とし、同じ色を4個以上つなげて消す20秒勝負。連鎖するほどスコア倍率が跳ね上がります。</p><a class="primary-btn" href="#game">パズルを始める</a></section>
  <section id="game" class="section puzzle-section">
    <div class="puzzle-shell">
      <div class="puzzle-hud"><div><span>TIME</span><strong id="p15-time">20.0</strong></div><div><span>SCORE</span><strong id="p15-score">0</strong></div><div><span>CHAIN</span><strong id="p15-chain">0</strong></div><div><span>BEST</span><strong id="p15-best">0</strong></div></div>
      <div class="puzzle-layout">
        <div class="puzzle-canvas-wrap"><canvas id="p15-canvas" width="420" height="720" aria-label="連鎖パズル盤面"></canvas><div id="p15-flash" class="chain-flash"></div><div id="p15-overlay" class="puzzle-overlay"><div class="puzzle-overlay-card"><p class="eyebrow">GAME 15</p><h2 id="p15-title">CHAIN ORBS</h2><p id="p15-message">同じ色を4個以上つなげて消そう。<br>連鎖すると大量得点。</p><button id="p15-start" class="puzzle-main-action" type="button">20秒スタート</button></div></div></div>
        <aside class="puzzle-side"><div class="next-box"><span>NEXT</span><canvas id="p15-next" width="140" height="140"></canvas></div><div class="puzzle-rules"><strong>操作</strong><p>PC：← → 移動 / ↓ 落下 / Z・X 回転 / Space 即落下</p><p>スマホ：下のボタンで操作</p></div></aside>
      </div>
      <div class="puzzle-touch" aria-label="タッチ操作"><button data-p15="left">◀</button><button data-p15="rotateL">↶</button><button data-p15="down">▼</button><button data-p15="rotateR">↷</button><button data-p15="right">▶</button><button class="wide" data-p15="drop">DROP</button></div>
    </div>
  </section>
</main>
<footer><div class="wrap">© 2026 20秒ミニゲームズ</div></footer>
<script src="mode-switch.js"></script><script src="puzzle15.js"></script>
</body></html>
