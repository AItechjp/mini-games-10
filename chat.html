<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ログインなしで使えるリアルタイムチャット。Supabase Realtimeで接続。"><title>GAME 13 - ログインなしチャット</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="mode-switch.css"><link rel="stylesheet" href="chat.css"></head>
<body class="chat-page"><header class="site-header"><div class="wrap header-inner"><a class="brand" href="index.html">20秒ミニゲームズ</a><nav><a href="#chat">チャット</a><a href="online.html">対戦</a></nav></div></header>
<main class="wrap"><div class="mode-switch-bar" aria-label="サイトモード"><button class="mode-switch-btn" data-mode-href="solo.html">1人用</button><button class="mode-switch-btn" data-mode-href="online.html">オンライン対戦</button><button class="mode-switch-btn" aria-pressed="true" data-mode-href="chat.html">チャット</button></div>
<section class="hero"><p class="eyebrow">GAME 13 / GUEST CHAT</p><h1>ログインなしで、話そう。</h1><p>アカウント作成不要のリアルタイムチャット。ニックネームだけ決めればすぐ参加できます。履歴は最大24時間です。</p></section>
<section id="chat" class="section"><div class="chat-rules"><strong>使い方:</strong> ニックネームは16文字まで、メッセージは240文字まで。連投防止のため送信は1秒に1回までです。公開チャットなので個人情報や秘密情報は書き込まないでください。</div>
<div class="chat-shell"><div class="chat-top"><div class="chat-profile"><label for="chat-name">ニックネーム</label><input id="chat-name" maxlength="16" autocomplete="nickname"></div><div class="chat-presence"><span id="chat-dot" class="chat-dot"></span><strong id="chat-status">接続中…</strong><span>ONLINE <b id="chat-online">0</b></span></div></div><div id="chat-messages" class="chat-messages"><div class="chat-empty">チャットを読み込んでいます…</div></div><form id="chat-form" class="chat-form"><textarea id="chat-input" maxlength="240" rows="2" placeholder="メッセージを入力（Enterで送信 / Shift+Enterで改行）"></textarea><button id="chat-send" class="chat-send" type="submit">送信</button><div class="chat-meta"><span id="chat-feedback">Supabase Realtime</span><span><b id="chat-count">0</b>/240</span></div></form></div></section></main><footer><div class="wrap">© 2026 20秒ミニゲームズ</div></footer>
<script src="mode-switch.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="chat.js"></script></body></html>
