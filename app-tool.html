<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070c16">
<title>APP TOOL - 使えるアプリ100</title>
<link rel="stylesheet" href="app-tool.css">
</head>
<body>
<main class="tool-wrap">
<section class="tool-head">
<div><p id="tool-kicker" class="tool-kicker">APP 000 / IMPLEMENTED</p><h1 id="tool-title">読み込み中…</h1><p id="tool-desc">アプリを準備しています。</p></div>
<div class="tool-head-actions"><a class="tool-link" href="apps.html">← アプリ100</a><button id="clear-app" class="tool-btn bad" type="button">このアプリのデータ消去</button></div>
</section>
<section class="tool-shell">
<div class="tool-status"><div><span>CATEGORY</span><strong id="tool-category">-</strong></div><div><span>STORAGE</span><strong>この端末に自動保存</strong></div><div><span>APP</span><strong id="tool-number">000 / 100</strong></div></div>
<div id="tool-main" class="tool-main"><div class="tool-panel"><p class="subtle">読み込み中…</p></div></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0"></script>
<script src="supabase-config.js"></script>
<script src="app-tool.js" defer></script>
</body>
</html>
