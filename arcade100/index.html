<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#10131e"><meta name="description" content="友達と遊ぶ100種類のオンライン対戦・協力ゲーム。招待コードで集まって、アクション、レース、カード、パズルを楽しもう。"><title>ARCADE 100 | AITECH GAMES</title><link rel="stylesheet" href="style.css"><script src="../supabase-config.js"></script><script type="module" src="app.mjs"></script></head>
<body><header class="topbar"><a href="../index.html" class="brand">AITECH<span>GAMES</span></a><span class="edition">ARCADE / 100</span><button id="libraryButton" class="quiet">ゲーム一覧</button></header>
<main><section id="library" aria-label="ゲーム一覧"><div class="library-head"><div><p class="eyebrow">PLAY TOGETHER</p><h1>今日は、何で遊ぶ？</h1><p>友達と対戦。仲間と協力。コードを共有して同じ部屋へ。</p></div><div class="count"><strong>100</strong><span>ONLINE GAMES</span></div></div><div class="filters"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="ゲームを探す" aria-label="ゲームを検索"></label><div class="mode-filters"><button data-filter="all" aria-pressed="true">すべて</button><button data-filter="pvp" aria-pressed="false">対戦</button><button data-filter="coop" aria-pressed="false">協力</button></div><select id="category" aria-label="ジャンル"><option value="">すべてのジャンル</option></select></div><div id="games" class="game-grid"></div><p id="empty" hidden>条件に合うゲームがありません。</p></section>
<section id="play" hidden><div class="game-heading"><div><p id="gameMeta" class="eyebrow"></p><h1 id="gameTitle"></h1></div><button id="leave" class="quiet" hidden>ルーム退出</button></div><div class="play-layout"><div class="play-main"><div class="stage-shell"><canvas id="stage" width="1000" height="600" aria-label="ゲーム盤面"></canvas><div class="stage-hud"><span id="clock">00:00</span><span id="progress"></span><button id="sound" aria-pressed="false" title="効果音">音 OFF</button><button id="fullscreen" title="全画面">全画面</button></div><div id="stageOverlay" class="stage-overlay"><div><p class="eyebrow">READY WHEN YOU ARE</p><h2>ルームを作って、友達を呼ぼう。</h2><p>招待コードがあれば、すぐに参加できます。</p></div></div><div id="touchControls" class="touch-controls" hidden><div id="stick" aria-label="移動スティック"><span></span></div><div class="touch-actions"><button id="touchB">B</button><button id="touchA">A</button></div></div></div><div id="scoreboard" class="scoreboard"></div><p id="gameMessage" class="game-message" aria-live="polite"></p><div id="hand" class="hand"></div><div id="market" class="market"></div><div id="actionPanel" class="action-panel"></div><div id="chatLog" class="chat-log" hidden></div></div>
<aside class="side-panel"><div id="lobby"><p class="eyebrow">ONLINE ROOM</p><h2>一緒に遊ぼう</h2><label>プレイヤー名<input id="name" maxlength="16" placeholder="PLAYER" autocomplete="nickname"></label><button id="create" class="primary">ルームを作る</button><div class="divider">または</div><label>招待コード<input id="roomCode" class="code-input" maxlength="6" placeholder="ABC234" autocapitalize="characters" autocomplete="off"></label><button id="join" class="secondary">ルームに参加</button><button id="resume" class="quiet" hidden>前のルームに戻る</button></div><div id="roomPanel" hidden><p class="eyebrow">INVITE YOUR FRIENDS</p><div class="room-code"><strong id="codeDisplay"></strong><button id="copyInvite">招待をコピー</button></div><ul id="members"></ul><button id="ready" class="primary">準備OK</button><button id="start" class="primary" hidden>ゲーム開始</button><button id="rematch" class="primary" hidden>もう一度遊ぶ</button><p id="connection" class="connection">接続中…</p></div><div class="howto"><p class="eyebrow">HOW TO PLAY</p><h2>遊び方</h2><p id="rules"></p><p id="inputHelp"></p><div id="privateInfo" class="private-info" hidden></div></div><p id="notice" role="status"></p></aside></div></section></main>
<footer><span>AITECH GAMES</span><a href="../index.html">主力3作品へ</a><a href="../legal.html">利用について</a></footer></body></html>
