name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk SilentCamera.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SilentCamera-apk
          path: SilentCamera.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: silent-camera-v${{ github.run_number }}
          name: 無音カメラ v${{ github.run_number }}
          files: SilentCamera.apk
