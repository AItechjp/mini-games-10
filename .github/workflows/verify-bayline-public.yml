name: Verify removed 3D URLs
on:
  workflow_run:
    workflows: ['Deploy GitHub Pages']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: removed-3d-public-verification
  cancel-in-progress: true
jobs:
  verify-removal:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify removed 3D pages and assets return 404 over valid HTTPS
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {mkdir,writeFile} from 'node:fs/promises';
          const output='test-output/removed-3d';
          await mkdir(output,{recursive:true});
          const report={checkedAt:new Date().toISOString(),checks:[],failures:[]};
          try {
            const release=await fetch('https://aitechd.com/https-release.json',{signal:AbortSignal.timeout(15000)});
            assert(release.ok,`Release manifest returned ${release.status}`);
            report.commit=(await release.json()).commit;
            const paths=['games-3d.html','bayline/','bayline/index.html','bayline/game.mjs','game23.html','game23-runtime.mjs','smash.html','smash.js','fps.html','touge/','racing.html','unity/black-site.html','unity/skybreak-rivals.html'];
            for (const hostname of ['aitechd.com','www.aitechd.com']) {
              for (const path of paths) {
                const url=`https://${hostname}/${path}?removal-audit=${report.commit}`;
                try {
                  // Native fetch validates every TLS certificate, including redirects.
                  const response=await fetch(url,{signal:AbortSignal.timeout(15000)});
                  report.checks.push({url,status:response.status,finalURL:response.url});
                  if(response.status!==404)report.failures.push(`${url} returned ${response.status}; expected 404`);
                  await response.body?.cancel();
                } catch(error) { report.failures.push(`${url}: ${error.message}`); }
              }
            }
          } catch(error) { report.failures.push(error.message); }
          report.passed=report.failures.length===0;
          await writeFile(`${output}/results.json`,JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(!report.passed)process.exitCode=1;
          JS
      - name: Retain removal verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: removed-3d-production-verification
          retention-days: 7
          path: test-output/removed-3d/
          if-no-files-found: error
