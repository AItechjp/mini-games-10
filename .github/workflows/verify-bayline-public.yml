name: Verify Bayline public release
on:
  workflow_run:
    workflows: ['Deploy GitHub Pages']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bayline-public-verification
  cancel-in-progress: true
jobs:
  live:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install verification browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify actual HTTPS deployment and two-player public UI
        run: node scripts/verify-bayline-public.mjs
      - name: Retain production screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bayline-production-verification
          retention-days: 7
          path: test-output/bayline-public/
