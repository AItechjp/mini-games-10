name: HTTPS full-site security audit

on:
  workflow_dispatch:
  # The deploy workflow already runs this full audit after publication.
  # Keep this dedicated entry point for manual rechecks, not pre-deploy pushes.

permissions:
  contents: read
  pages: read

concurrency:
  group: https-security-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Select the currently deployed release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          commit="$(curl --fail --silent --show-error 'https://aitechd.com/https-release.json' | jq -er '.commit | select(test("^[0-9a-f]{40}$"))')"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify server enforcement and approved certificate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p test-output/https
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{cname,https_enforced,https_certificate}' > test-output/https/pages-settings.json
          cat test-output/https/pages-settings.json
          jq -e '.cname == "aitechd.com" and .https_enforced == true and .https_certificate.state == "approved"' test-output/https/pages-settings.json
      - name: Install full Chromium runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inspect all live pages without bypassing certificate errors
        env:
          HTTPS_BASE_URL: https://aitechd.com/
          HTTPS_EXPECT_COMMIT: ${{ steps.release.outputs.commit }}
        run: node tests/https-live.mjs
      - name: Save full security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: https-security-verification
          path: test-output/https/
          retention-days: 7
          if-no-files-found: error
