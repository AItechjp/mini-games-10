name: Domain Check

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check DNS and HTTP
        shell: bash
        run: |
          set +e
          echo '=== NS ==='
          nslookup -type=NS aitechd.com || true
          echo '=== apex A default resolver ==='
          nslookup -type=A aitechd.com || true
          echo '=== apex A on お名前.com authoritative DNS ==='
          for ns in 01.dnsv.jp 02.dnsv.jp 03.dnsv.jp 04.dnsv.jp; do
            echo "--- $ns ---"
            nslookup -type=A aitechd.com "$ns" || true
          done
          echo '=== www CNAME default resolver ==='
          nslookup -type=CNAME www.aitechd.com || true
          echo '=== www CNAME on お名前.com authoritative DNS ==='
          for ns in 01.dnsv.jp 02.dnsv.jp 03.dnsv.jp 04.dnsv.jp; do
            echo "--- $ns ---"
            nslookup -type=CNAME www.aitechd.com "$ns" || true
          done
          echo '=== HTTPS apex ==='
          curl -I -L --max-time 20 https://aitechd.com/ || true
          echo '=== HTTPS www ==='
          curl -I -L --max-time 20 https://www.aitechd.com/ || true
