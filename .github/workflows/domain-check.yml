name: Domain Check

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check DNS and HTTP
        shell: bash
        run: |
          set +e
          echo '=== apex IPv4 ==='
          getent ahostsv4 aitechd.com || true
          echo '=== www IPv4 ==='
          getent ahostsv4 www.aitechd.com || true
          echo '=== CNAME via nslookup ==='
          nslookup -type=CNAME www.aitechd.com || true
          echo '=== HTTPS apex ==='
          curl -I -L --max-time 20 https://aitechd.com/ || true
          echo '=== HTTPS www ==='
          curl -I -L --max-time 20 https://www.aitechd.com/ || true
