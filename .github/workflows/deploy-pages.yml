name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Finish the active deployment; queue the latest update without starving publication.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install declared root build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -maxdepth 2 -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
      - name: Verify Commons stays on the AITECH domain
        run: node tests/commons-domain.mjs
      - name: Verify card catalog parsing
        run: |
          node tests/card-library.mjs
          node tests/yugioh-library.mjs
      - name: Setup Commons package manager
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Verify Commons data, recovery and commercial configuration
        working-directory: commons-src
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          node scripts/test-commercial.mjs
          node scripts/test-recovery.mjs
          node scripts/test-sauna.mjs
          node scripts/test-sauna-nationwide.mjs
          python3 scripts/test-sauna-inventory.py
          node scripts/test-local-hours.mjs
          node scripts/test-coverage.mjs
          node scripts/test-realtime.mjs
      - name: Build Commons from its current source
        working-directory: commons-src
        run: pnpm build:aitech
      - name: Verify government graph and reemployment source coverage
        run: node tests/government-data.mjs
      - name: Verify cyber news parsing and retention
        run: node tests/cyber-news.mjs
      - name: Verify free manga collection and availability
        run: |
          node tests/manga-links.mjs
          node tests/manga-free.mjs
      - name: Validate past-question-only learning source
        run: node tests/yobi-past-source.mjs
      - name: Verify retained 2D games and learning rules
        run: |
          node tests/quick-hop.mjs
          node tests/startrail.mjs
          node tests/lantern-duo.mjs
          node tests/pulse-drums.mjs
          node tests/pulse-drums-coop.mjs
          node tests/cyber-quiz.mjs
          node tests/ghostline.mjs
          node tests/quiz-raid.mjs
      - name: Install browser smoke-test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Harden every public web asset for HTTPS
        run: node https-hardening.mjs
      - name: Verify hardening is idempotent
        shell: bash
        run: |
          set -euo pipefail
          before="$(git diff -- . ':!.github' ':!tests' ':!supabase' | sha256sum | cut -d' ' -f1)"
          cp https-release.json /tmp/https-release-first.json
          node https-hardening.mjs
          after="$(git diff -- . ':!.github' ':!tests' ':!supabase' | sha256sum | cut -d' ' -f1)"
          test "$before" = "$after"
          cmp https-release.json /tmp/https-release-first.json
      - name: Compile and verify the public-only distribution
        run: |
          node scripts/build-static.mjs
          node tests/private-distribution.mjs
          node tests/usage-dashboard.mjs
          node tests/browser-release.mjs
          node tests/quality-release.mjs
          node tests/app-guide-model.mjs
          node tests/commercial-core.mjs
          node tests/site-retention.mjs
      - name: Smoke test retained apps and Commons locally
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist >/tmp/site-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/games.html >/dev/null && curl -fsS http://127.0.0.1:4173/commons/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/games.html >/dev/null
          curl -fsS http://127.0.0.1:4173/commons/ >/dev/null
          curl -fsS http://127.0.0.1:4173/yobi-quiz.html | grep -q 'yobi-past.js'
          node tests/retained-browser.mjs
          node tests/quiz-raid-browser.mjs
          node tests/usage-dashboard-browser.mjs
          node tests/commons-realtime-browser.mjs
          node tests/government-network-browser.mjs
          node tests/quality-browser.mjs
          node tests/commercial-browser.mjs
          node tests/official-info-browser.mjs
          APP_GUIDE_BASE_URL=http://127.0.0.1:4173/ node tests/app-guide-smoke.mjs
          YOBI_BASE_URL=http://127.0.0.1:4173/ node tests/yobi-past-smoke.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Verify domain and server-side HTTPS enforcement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" > /tmp/pages-security.json
          jq '{cname,https_enforced,https_certificate}' /tmp/pages-security.json
          jq -e '.cname == "aitechd.com" and .https_enforced == true and .https_certificate.state == "approved"' /tmp/pages-security.json
      - name: Stage public files without test runtimes or reports
        run: |
          python3 - <<'PY_SIZE'
          from pathlib import Path
          size = sum(p.stat().st_size for p in Path('dist').rglob('*') if p.is_file())
          print(f'Published site: {size:,} bytes')
          assert size < 1_000_000_000, 'Published site exceeds the GitHub Pages 1 GB size limit'
          PY_SIZE
          test -f dist/https-release.json
          test ! -d dist/node_modules
          test ! -d dist/arcade100/backend
      - name: Upload hardened artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed retained apps and removed URLs
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          ok=0
          for i in {1..18}; do
            if curl -fsS "${PAGE_URL}https-release.json?retention=${GITHUB_SHA}" | jq -e --arg sha "$GITHUB_SHA" '.commit == $sha' >/dev/null; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          RETAINED_BASE_URL="$PAGE_URL" node tests/retained-browser.mjs
          YOBI_BASE_URL="$PAGE_URL" node tests/yobi-past-smoke.mjs
      - name: Verify every page in desktop and Android Chromium
        if: ${{ !cancelled() && steps.deployment.outcome == 'success' }}
        env:
          HTTPS_BASE_URL: https://aitechd.com/
          HTTPS_EXPECT_COMMIT: ${{ github.sha }}
        run: node tests/https-live.mjs
      - name: Retain HTTPS security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: https-security-verification
          path: test-output/https/
          retention-days: 7
      - name: Retain public-app verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retained-app-verification
          path: test-output/
          retention-days: 7
