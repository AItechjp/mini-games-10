name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Finish the active deployment; queue the latest update without starving publication.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -maxdepth 2 -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
      - name: Verify Commons stays on the AITECH domain
        run: node tests/commons-domain.mjs
      - name: Validate past-question-only learning source
        run: node tests/yobi-past-source.mjs
      - name: Verify arcade game rules and room security
        run: |
          node tests/paper-arcade.mjs
          node tests/arcade-games.mjs
          node tests/arcade-online.mjs
          node tests/smash-online-state.mjs
          node tests/graphics-performance.mjs
          node tests/fps-systems.mjs
          node tests/game23-systems.mjs
          node tests/gomoku.mjs
          node tests/classic-deluxe.mjs
          node tests/babanuki.mjs
      - name: Install browser smoke-test runtime and self-hosted 3D engine
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 three@0.180.0
          npx playwright install --with-deps chromium
          mkdir -p touge/vendor
          cp -r node_modules/three/build node_modules/three/examples touge/vendor/
          cp node_modules/three/LICENSE touge/vendor/LICENSE
      - name: Harden every public web asset for HTTPS
        run: node https-hardening.mjs
      - name: Verify hardening is idempotent
        shell: bash
        run: |
          set -euo pipefail
          before="$(git diff -- . ':!.github' ':!tests' ':!supabase' | sha256sum | cut -d' ' -f1)"
          cp https-release.json /tmp/https-release-first.json
          node https-hardening.mjs
          after="$(git diff -- . ':!.github' ':!tests' ':!supabase' | sha256sum | cut -d' ' -f1)"
          test "$before" = "$after"
          cmp https-release.json /tmp/https-release-first.json
      - name: Smoke test games and learning tools locally
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/site-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/mega-arcade.html >/dev/null && curl -fsS http://127.0.0.1:4173/yobi-quiz.html >/dev/null && curl -fsS http://127.0.0.1:4173/game23.html >/dev/null && curl -fsS http://127.0.0.1:4173/fps.html >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/mega-arcade.html >/dev/null
          curl -fsS http://127.0.0.1:4173/yobi-quiz.html | grep -q 'yobi-past.js'
          curl -fsS http://127.0.0.1:4173/game23.html | grep -q 'game23-v3-loader.js'
          curl -fsS http://127.0.0.1:4173/fps.html | grep -q 'fps-game.js'
          MEGA_BASE_URL=http://127.0.0.1:4173/ MEGA_FULL=1 node tests/mega-smoke.mjs
          YOBI_BASE_URL=http://127.0.0.1:4173/ node tests/yobi-past-smoke.mjs
          GAME23_BASE_URL=http://127.0.0.1:4173/ node tests/game23-smoke.mjs
          FPS_BASE_URL=http://127.0.0.1:4173/ node tests/fps-smoke.mjs
          TOUGE_BASE_URL=http://127.0.0.1:4173/ node tests/touge-smoke.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Verify domain and server-side HTTPS enforcement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" > /tmp/pages-security.json
          jq '{cname,https_enforced,https_certificate}' /tmp/pages-security.json
          jq -e '.cname == "aitechd.com" and .https_enforced == true and .https_certificate.state == "approved"' /tmp/pages-security.json
      - name: Stage public files without test runtimes or reports
        run: |
          node scripts/build-static.mjs
          test -f dist/https-release.json
          test ! -d dist/node_modules
          test ! -d dist/arcade100/backend
      - name: Upload hardened artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed Pages in browser
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          ok=0
          for i in {1..18}; do
            if curl -fsS "${PAGE_URL}mega-arcade.html" | grep -q 'mega-final.js' && curl -fsS "${PAGE_URL}yobi-quiz.html" | grep -q 'yobi-past.js' && curl -fsS "${PAGE_URL}game23.html" | grep -q 'game23-v3-loader.js' && curl -fsS "${PAGE_URL}fps.html" | grep -q 'LIMINAL ZOMBIE FPS — REBORN'; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          MEGA_BASE_URL="$PAGE_URL" MEGA_FULL=0 node tests/mega-smoke.mjs
          YOBI_BASE_URL="$PAGE_URL" node tests/yobi-past-smoke.mjs
          GAME23_BASE_URL="$PAGE_URL" node tests/game23-smoke.mjs
          FPS_BASE_URL="$PAGE_URL" node tests/fps-smoke.mjs
          TOUGE_BASE_URL="$PAGE_URL" node tests/touge-smoke.mjs
      - name: Verify every page in desktop and Android Chromium
        if: ${{ !cancelled() && steps.deployment.outcome == 'success' }}
        env:
          HTTPS_BASE_URL: https://aitechd.com/
          HTTPS_EXPECT_COMMIT: ${{ github.sha }}
        run: node tests/https-live.mjs
      - name: Retain HTTPS security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: https-security-verification
          path: test-output/https/
          retention-days: 7
      - name: Retain racing verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touge-deployed-verification
          path: test-output/
          retention-days: 7
