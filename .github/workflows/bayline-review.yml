name: Bayline release verification
on:
  push:
    branches: [main, feat/bayline-city]
    paths: ['bayline/**', 'tests/bayline-*', 'scripts/bayline-*', '.github/workflows/bayline-review.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bayline-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed source corrections
        run: |
          node scripts/bayline-source-fixes.mjs
          if [ "${GITHUB_REF}" = "refs/heads/feat/bayline-city" ] && ! git diff --quiet -- bayline/core.mjs bayline/world.mjs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add bayline/core.mjs bayline/world.mjs
            git commit -m 'fix(bayline): normalize mesh UVs, controls and objective timing'
            git push origin HEAD:feat/bayline-city
          fi
      - name: Install pinned rendering and browser runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 three@0.180.0
          npx playwright install --with-deps chromium
          mkdir -p touge/vendor
          cp -r node_modules/three/build node_modules/three/examples touge/vendor/
          cp node_modules/three/LICENSE touge/vendor/LICENSE
      - name: Syntax validation
        run: |
          for f in bayline/*.mjs; do node --check "$f"; done
          node --check tests/bayline-core.mjs
          node --check tests/bayline-smoke.mjs
      - name: Verify simulation and campaign progression
        id: core
        continue-on-error: true
        run: node tests/bayline-core.mjs
      - name: Verify desktop, mobile and real two-browser cooperation
        id: browser
        continue-on-error: true
        run: |
          python3 -m http.server 4173 >/tmp/bayline-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:4173/bayline/ >/dev/null && break || sleep 1; done
          node tests/bayline-smoke.mjs
      - name: Retain source, runtime and actual screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bayline-review
          retention-days: 7
          path: |
            bayline/
            tests/bayline-*.mjs
            supabase-config.js
            touge/vendor/build/
            touge/vendor/examples/jsm/
            touge/vendor/LICENSE
            test-output/bayline/
      - name: Require both verification suites
        if: always()
        env:
          CORE: ${{ steps.core.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: test "$CORE" = success && test "$BROWSER" = success
