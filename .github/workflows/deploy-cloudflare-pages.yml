name: Deploy Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-pages"
  cancel-in-progress: true

env:
  CF_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'aitechjp-mini-games-10' }}
  WRANGLER_VERSION: "4.130.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -maxdepth 2 -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Validate past-question-only learning source
        run: node tests/yobi-past-source.mjs

      - name: Build static bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          rsync -a ./ dist/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'supabase/' \
            --exclude 'dist/' \
            --exclude 'cloudflare/' \
            --exclude '*.md' \
            --exclude 'supabase-config.example.js'
          test -f dist/index.html
          test -f dist/mega-arcade.html
          test -f dist/mega-final.js
          test -f dist/yobi-quiz.html
          test -f dist/yobi-past.js
          test -f dist/yobi-past.css
          grep -q 'yobi-past.js' dist/yobi-quiz.html
          ! grep -q 'yobi-complete.js' dist/yobi-quiz.html
          test -f dist/supabase-config.js

      - name: Detect Cloudflare credentials
        id: cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials detected."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials are not configured; GitHub Pages remains the active public deployment and Cloudflare deployment is skipped."
          fi

      - name: Normalize Cloudflare API token
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          token="$(python - <<'PY'
          import os, re
          raw = os.environ.get('RAW_CLOUDFLARE_API_TOKEN', '')
          s = raw.replace('\r', '').replace('\n', '').strip()
          s = s.strip('"\'').strip()
          m = re.search(r'(?i)\bbearer\s+([A-Za-z0-9._~+/-]+)', s)
          if m:
              s = m.group(1)
          else:
              m = re.search(r'cfut_[A-Za-z0-9_-]+', s)
              if m:
                  s = m.group(0)
          s = s.strip().strip('"\'')
          print(s, end='')
          PY
          )"
          test -n "$token"
          echo "::add-mask::$token"
          printf 'CLOUDFLARE_API_TOKEN_NORMALIZED=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Verify Cloudflare API token
        if: steps.cloudflare.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/cf-token.json -w '%{http_code}' \
            'https://api.cloudflare.com/client/v4/user/tokens/verify' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN_NORMALIZED}")"
          if [ "$status" != "200" ] || [ "$(jq -r '.success // false' /tmp/cf-token.json)" != "true" ] || [ "$(jq -r '.result.status // empty' /tmp/cf-token.json)" != "active" ]; then
            cat /tmp/cf-token.json
            echo "::error::Cloudflare API token is not valid and active. Save only the one-time API Token secret value in CLOUDFLARE_API_TOKEN (not the token name, token ID, Global API Key, or a curl command)."
            exit 1
          fi
          echo "Cloudflare API token is valid and active."

      - name: Ensure Cloudflare Pages project
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CF_PAGES_PROJECT}"
          status="$(curl -sS -o /tmp/cf-project.json -w '%{http_code}' "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN_NORMALIZED}")"
          if [ "$status" = "404" ]; then
            payload="$(jq -nc --arg name "$CF_PAGES_PROJECT" '{name:$name,production_branch:"main"}')"
            curl --fail-with-body -sS \
              -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN_NORMALIZED}" \
              -H "Content-Type: application/json" \
              --data "$payload"
          elif [ "$status" != "200" ]; then
            cat /tmp/cf-project.json
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN_NORMALIZED}"
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy dist \
            --project-name="${CF_PAGES_PROJECT}" \
            --branch=main
