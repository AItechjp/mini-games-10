name: Deploy Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-pages"
  cancel-in-progress: true

env:
  CF_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'aitechjp-mini-games-10' }}
  WRANGLER_VERSION: "4.130.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -maxdepth 2 -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Validate preliminary-exam 1000-question bank
        run: node tests/yobi-bank-smoke.mjs

      - name: Build static bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          rsync -a ./ dist/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'supabase/' \
            --exclude 'dist/' \
            --exclude 'cloudflare/' \
            --exclude '*.md' \
            --exclude 'supabase-config.example.js'
          test -f dist/index.html
          test -f dist/mega-arcade.html
          test -f dist/mega-final.js
          test -f dist/yobi-quiz.html
          test -f dist/yobi-complete-data.js
          test -f dist/yobi-complete-fixes.js
          test -f dist/yobi-complete.js
          grep -q 'yobi-complete.js' dist/yobi-quiz.html
          test -f dist/supabase-config.js

      - name: Detect Cloudflare credentials
        id: cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials detected."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials are not configured; GitHub Pages remains the active public deployment and Cloudflare deployment is skipped."
          fi

      - name: Verify Cloudflare API token
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/cf-token.json -w '%{http_code}' \
            'https://api.cloudflare.com/client/v4/user/tokens/verify' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          if [ "$status" != "200" ] || [ "$(jq -r '.success // false' /tmp/cf-token.json)" != "true" ] || [ "$(jq -r '.result.status // empty' /tmp/cf-token.json)" != "active" ]; then
            cat /tmp/cf-token.json
            echo "::error::Cloudflare API token is invalid, inactive, expired, or not an API Token secret. Create/roll a Cloudflare API Token and save the one-time token value in CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          echo "Cloudflare API token is valid and active."

      - name: Ensure Cloudflare Pages project
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CF_PAGES_PROJECT}"
          status="$(curl -sS -o /tmp/cf-project.json -w '%{http_code}' "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          if [ "$status" = "404" ]; then
            payload="$(jq -nc --arg name "$CF_PAGES_PROJECT" '{name:$name,production_branch:"main"}')"
            curl --fail-with-body -sS \
              -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$payload"
          elif [ "$status" != "200" ]; then
            cat /tmp/cf-project.json
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy dist \
            --project-name="${CF_PAGES_PROJECT}" \
            --branch=main
