name: Archived game source review
on:
  pull_request:
    paths: ['graphics-performance.js', 'tests/graphics-performance.mjs', 'arcade100/**', 'smash*', 'tests/arcade*', 'tests/smash-online-state.mjs', 'scripts/public-scope.mjs', '.github/workflows/arcade-review.yml']
  push:
    branches: ['main']
    paths: ['graphics-performance.js', 'tests/graphics-performance.mjs', 'arcade100/**', 'smash*', 'tests/arcade*', 'tests/smash-online-state.mjs', 'scripts/public-scope.mjs', '.github/workflows/arcade-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify all game engines
        run: node tests/arcade-games.mjs
      - name: Verify room security and concurrency
        run: node tests/arcade-online.mjs
      - name: Verify SKYBREAK multiplayer snapshots
        run: |
          node tests/smash-online-state.mjs
          node tests/graphics-performance.mjs
      - name: Verify source syntax and exclusion from publication
        run: |
          node --check arcade100/app.mjs
          node --check arcade100/render.mjs
          node --check arcade100/network.mjs
          node --check smash.js
          node --check smash-online.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {isPublicPath} from './scripts/public-scope.mjs';
          for (const path of ['arcade100/index.html','arcade100/app.mjs','smash.html','smash.js','game23.html']) {
            assert.equal(isPublicPath(path), false, `Archived source must stay outside the public site: ${path}`);
          }
          JS
